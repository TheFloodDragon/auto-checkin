name: 自动签到
run-name: 自动签到 - ${{ github.event_name }}

on:
  schedule:
    - cron: '30 1 * * *'
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      run_all:
        description: '忽略当天已完成结果，强制执行全部签到'
        type: boolean
        required: false
        default: false
      account_ids:
        description: '可选：仅执行这些账号 ID，逗号分隔；留空执行全部账号'
        type: string
        required: false
        default: ''
      task_ids:
        description: '可选：仅执行这些任务 ID（含依赖），逗号分隔；例如 daily'
        type: string
        required: false
        default: ''
      oauth_force_verify:
        description: '强制校验所选账号依赖的共享 OAuth 登录态并保存实际轮换结果'
        type: boolean
        required: false
        default: false

concurrency:
  group: auto-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: 1
      TZ: Asia/Shanghai
      CHECKIN_HEADLESS: 'false'
      CHECKIN_PROXY: ${{ secrets.CHECKIN_PROXY }}
      SETTINGS: ${{ secrets.SETTINGS }}
      # 浏览器内核：默认 Camoufox（Firefox）。实测 linux.do / connect.linux.do 的
      # Cloudflare 托管挑战在 CI 里从未放行 Camoufox，而同一出口下 Chromium 正常放行；
      # 设仓库变量 CHECKIN_BROWSER=edge 时改用 Runner 自带的 Google Chrome（Chromium）。
      CHECKIN_BROWSER: ${{ vars.CHECKIN_BROWSER || '' }}
      CHECKIN_BROWSER_PATH: ${{ vars.CHECKIN_BROWSER_PATH || '' }}
      # 按站点分流的引擎覆盖：host=引擎,host=engine。这两类挑战对内核的偏好相反，
      # 全局只有一个引擎时必然有一类打不通：
      #   - linux.do / connect.linux.do 的托管挑战 → 只有 Chromium 能过；
      #   - k40.shengqainbang.cn / sub.100xlabs.space 内嵌的 Turnstile widget
      #     → Camoufox 无需点击即自动签发，Chromium 点击后恒定 click_unconfirmed。
      CHECKIN_BROWSER_ENGINES: ${{ vars.CHECKIN_BROWSER_ENGINES || '' }}

    steps:
      - name: 检出代码
        id: checkout
        uses: actions/checkout@v7

      - name: 恢复上次签到结果缓存
        id: results_cache
        uses: actions/cache/restore@v6
        with:
          path: .cache-checkin
          key: ${{ runner.os }}-checkin-results-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-checkin-results-

      - name: 设置 uv
        id: setup_uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "latest"

      - name: 设置 Python
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # 同样改成 restore + save：本工作流有失败项时整体以失败收尾，
      # actions/cache 的 post-if: success() 会让保存步骤永远被跳过，
      # 依赖每轮都要重新下载编译。
      - name: 恢复 uv 依赖缓存
        uses: actions/cache/restore@v6
        id: uv_cache
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-python-3.14-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-python-3.14-uv-

      - name: 安装锁定依赖
        id: uv_sync
        run: uv sync --locked --extra dev

      - name: 保存 uv 依赖缓存
        if: steps.uv_sync.outcome == 'success' && steps.uv_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-python-3.14-uv-${{ hashFiles('uv.lock') }}

      - name: 恢复 ACCOUNTS 密钥
        id: restore_accounts
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
        run: |
          uv run python - <<'PY'
          import os
          import tempfile
          from pathlib import Path

          from config.secret_codec import decode_secret

          data = os.environ.get('ACCOUNTS', '').strip()
          if not data:
              raise SystemExit('未配置 Secret: ACCOUNTS')
          try:
              data = decode_secret(data)
          except ValueError as exc:
              raise SystemExit(f'ACCOUNTS Secret 解码失败: {exc}') from exc
          target = Path('ACCOUNTS.json')
          fd, name = tempfile.mkstemp(prefix='.ACCOUNTS.json.', suffix='.tmp', dir='.')
          try:
              with os.fdopen(fd, 'w', encoding='utf-8') as handle:
                  handle.write(data)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.chmod(name, 0o600)
              os.replace(name, target)
              os.chmod(target, 0o600)
          finally:
              try:
                  Path(name).unlink()
              except FileNotFoundError:
                  pass
          print('已安全写入 ACCOUNTS.json')
          PY

      - name: 检测是否需要 mihomo 桥接
        id: detect_mihomo
        run: |
          need=$(uv run python - <<'PY'
          import json
          from config import paths, store
          from config.secret_codec import decode_secret
          from core.errors import ConfigError

          try:
              # 检测不迁移账号；真正执行时仍能携带 Overlay 重挂旧凭据缓存键。
              # 节点在 ACCOUNTS 中；只在它缺少节点字段时兼容旧版 SETTINGS 预设里的节点。
              with paths.file_lock(paths.ACCOUNTS_PATH):
                  raw = json.loads(decode_secret(paths.ACCOUNTS_PATH.read_text(encoding='utf-8-sig')))
                  if not isinstance(raw, (dict, list)):
                      raise ConfigError('账号配置必须是对象或旧版数组')
                  store.prepare_settings()
                  data = store.with_legacy_proxies(raw if isinstance(raw, dict) else {'accounts': raw})
          except (ConfigError, OSError, UnicodeError, ValueError):
              raise SystemExit('ACCOUNTS 或 SETTINGS 配置无效，请检查配置')
          else:
              def has_bridge(value):
                  if isinstance(value, dict):
                      return 'clash' in value or any(has_bridge(item) for item in value.values())
                  if isinstance(value, list):
                      return any(has_bridge(item) for item in value)
                  return False
              print('true' if has_bridge(data) else 'false')
          PY
          )
          echo "need_mihomo=$need" >> "$GITHUB_OUTPUT"
          echo "need_mihomo=$need"

      - name: 安装 mihomo 代理桥
        id: install_mihomo
        if: steps.detect_mihomo.outputs.need_mihomo == 'true'
        run: bash ci/install_mihomo.sh

      - name: 检测是否需要浏览器签到
        id: detect_browser
        env:
          OAUTH_FORCE_VERIFY: ${{ inputs.oauth_force_verify }}
        run: |
          if [ "${OAUTH_FORCE_VERIFY:-false}" = "true" ]; then
            need=$(uv run python -m apps.cli --requires browser --oauth-force-verify)
          else
            need=$(uv run python -m ci.detect_browser)
          fi
          echo "need_browser=$need" >> "$GITHUB_OUTPUT"
          echo "need_browser=$need"

      - name: 安装浏览器系统依赖
        id: browser_dependencies
        if: steps.detect_browser.outputs.need_browser == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-color-emoji fonts-wqy-zenhei fonts-unifont

